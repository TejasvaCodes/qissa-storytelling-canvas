<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">QISSA — Wear Your Story</title>
  <desc id="desc">QISSA wordmark framed by a refined gold stitched border</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8E6429"/>
      <stop offset="0.48" stop-color="#E7C67A"/>
      <stop offset="1" stop-color="#A87531"/>
    </linearGradient>
  </defs>

  <rect width="720" height="220" rx="2" fill="#0D1B2A"/>

  <!-- stitched outer frame -->
  <rect x="34" y="24" width="652" height="172" rx="2" fill="none" stroke="url(#gold)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="3 8"/>

  <!-- layered stitch details at each corner -->
  <g fill="none" stroke="url(#gold)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 48V24H58 M42 54V34H62 M50 42H70"/>
    <path d="M662 24H686V48 M658 34H678V54 M650 42H670"/>
    <path d="M34 172V196H58 M42 166V186H62 M50 178H70"/>
    <path d="M662 196H686V172 M658 186H678V166 M650 178H670"/>
  </g>

  <g fill="url(#gold)" text-anchor="middle">
    <text x="360" y="115" font-family="Cormorant Garamond, Georgia, serif" font-size="108" font-weight="500" letter-spacing="11">QISSA</text>
    <text x="360" y="166" font-family="Cormorant Garamond, Georgia, serif" font-size="34" font-weight="500" letter-spacing="1.2">Wear Your Story</text>
  </g>
</svg>
